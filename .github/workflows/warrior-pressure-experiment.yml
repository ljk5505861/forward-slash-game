name: Warrior pressure experiment (DO NOT MERGE)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/warrior-pressure-experiment.mjs
      - .github/workflows/warrior-pressure-experiment.yml
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --prefix /tmp/warrior-browser playwright@1.55.1
          node /tmp/warrior-browser/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - name: Run controlled combat parameter experiments
        env:
          PLAYWRIGHT_MODULE: /tmp/warrior-browser/node_modules/playwright/index.mjs
          EXPERIMENT_BROWSER: ${{ matrix.browser }}
        run: node scripts/warrior-pressure-experiment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warrior-pressure-${{ matrix.browser }}
          path: test-artifacts/warrior-pressure
