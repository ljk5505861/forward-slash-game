name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  v01113-full-pr-validation:
    name: v0.11.13 full PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize v0.11.14 version
        if: github.head_ref == 'codex/v01114-summon-creature-contracts'
        run: |
          node scripts/sync-01114-version.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: synchronize version to v0.11.14"
            git push origin HEAD:refs/heads/codex/v01114-summon-creature-contracts
          fi

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Install dependencies
        run: npm ci

      - name: Validate summon creature contracts
        run: npm run validate:01114-summon-creature-contracts

      - name: Validate profession rework
        run: npm run validate:01113-profession-rework

      - name: Validate mech flow
        run: npm run validate:01112-mech-flow

      - name: Validate spell tide
        run: npm run validate:01111-spell-tide

      - name: Validate kinetic release
        run: npm run validate:01110-kinetic-release

      - name: Validate charged slam
        run: npm run validate:01109-charged-slam

      - name: Validate human god
        run: npm run validate:01108-human-god

      - name: Validate superhero flow
        run: npm run validate:01098-superhero-flow

      - name: Validate superhero kinetic enhancement
        run: npm run validate:01100-superhero-kinetic

      - name: Validate strength flow
        run: npm run validate:01060-strength-balance

      - name: Validate defense flow
        run: npm run validate:01062-defense-rework

      - name: Validate flame and solar flow
        run: npm run validate:01044-flame-rework

      - name: Validate skill pool
        run: npm run validate:01056-open-skill-pool

      - name: Validate selection and replacement flow
        run: npm run validate:01105-full-slot-upgrade-guarantee

      - name: Validate reward build bias
        run: npm run validate:reward-bias

      - name: Validate sky covering palm
        run: npm run validate:01104-sky-covering-palm

      - name: Validate mantra heavenly book
        run: npm run validate:01107-mantra-heavenly-book

      - name: Validate soul destroying needle
        run: npm run validate:01106-soul-destroying-needle

      - name: Validate full skill slot upgrade guarantee
        run: npm run validate:01105-full-slot-upgrade-guarantee

      - name: Validate active skill modifiers
        run: npm run validate:01103-active-skill-modifiers

      - name: Validate alchemy
        run: npm run validate:01102-alchemy

      - name: Validate ninefold dao
        run: npm run validate:01101-ninefold-dao

      - name: Validate full v0.11.11 playtest regression chain
        run: npm run validate:01107-playtest-fixes

      - name: Validate gravity runtime directly
        run: node scripts/validate-01087-gravity-flow-runtime.mjs

      - name: Validate gravity flow
        run: npm run validate:01087-gravity-flow

      - name: Validate black hole gravity rework
        run: npm run validate:01094-black-hole-gravity-rework

      - name: Validate black hole no-collapse behavior
        run: npm run validate:01095-black-hole-no-collapse

      - name: Validate gravity crush column
        run: npm run validate:01096-gravity-crush-column

      - name: Validate skill damage
        run: npm run validate:01040-skill-damage

      - name: Build production bundle
        run: npm run build
