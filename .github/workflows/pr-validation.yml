name: PR Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    # Keep the historical check name for branch protection compatibility.
    name: v0.11.15 full PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check patch whitespace
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Test validation scope rules
        run: node --test scripts/test-pr-validation-scope.mjs
      - name: Select task checks (manual dispatch runs full suite)
        id: scope
        env:
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/pr-validation-scope.mjs select "$BASE_SHA" "$HEAD_SHA"
      - name: Install dependencies
        if: steps.scope.outputs.mode != 'none'
        run: npm ci
      - name: Build production bundle
        if: steps.scope.outputs.mode != 'none'
        run: npm run build
      - name: Run declared task checks
        if: steps.scope.outputs.mode == 'task'
        run: node scripts/pr-validation-scope.mjs run "$BASE_SHA" "$HEAD_SHA"
      - name: Run full regression against base (manual only)
        if: steps.scope.outputs.mode == 'full'
        env:
          VALIDATION_BASE_SHA: ${{ env.BASE_SHA }}
        run: node scripts/run-validation-suite.mjs
      - name: Install browser runtime (manual full validation only)
        if: steps.scope.outputs.mode == 'full'
        run: |
          npm install --prefix /tmp/game-shop-browser playwright@1.55.1
          node /tmp/game-shop-browser/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Run full browser checks (manual only)
        if: steps.scope.outputs.mode == 'full'
        env:
          PLAYWRIGHT_MODULE: /tmp/game-shop-browser/node_modules/playwright/index.mjs
        run: node scripts/shop-browser-smoke.mjs
      - name: Upload full browser screenshots
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: shop-browser-screenshots
          path: test-artifacts/shop
          if-no-files-found: ignore
